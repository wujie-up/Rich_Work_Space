appId: local.workdesk.desktop
productName: DeskPG
directories:
  output: desk/dist/releases.noindex
electronDist: node_modules/electron/dist
files:
  - desk/src/main/**
  - desk/src/shared/**
  - desk/src/preload.cjs
  - desk/dist/renderer/**
  - desk/dist/plugins/**
  - web/src/server/**
  - web/dist/**
  - package.json
afterPack: desk/build/prepare-native-runtime.mjs
afterAllArtifactBuild: desk/build/check-mac-installation.mjs
asar: true
asarUnpack:
  - node_modules/node-pty/**
mac:
  icon: desk/src/main/os/mac/resource/app.icns
  category: public.app-category.developer-tools
  identity: '-'
  hardenedRuntime: false
  target:
    - dmg
    - zip
  artifactName: 'DeskPG-${version}-${arch}.${ext}'
dmg:
  sign: false
  title: DeskPG
  contents:
    - x: 150
      y: 180
      type: file
    - x: 440
      y: 180
      type: link
      path: /Applications
