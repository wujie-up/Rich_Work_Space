<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent 抓包</title><link rel="stylesheet" href="./app.css"></head>
<body>
  <div class="toolbar"><button id="toggle" disabled title="开始记录" aria-label="开始记录" class="icon-button"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 4 12 8-12 8z"/></svg></button><label>Agent 窗口 <select id="agent-window"><option value="">选择 Agent 窗口</option></select></label><label>对话 <select id="conversation"><option value="">选择具体对话</option></select></label><button id="refresh" title="刷新目标" aria-label="刷新目标" class="icon-button"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10a8 8 0 1 0-1 7 M20 4v6h-6"/></svg></button></div>
  <div id="status" role="status">正在连接插件</div>
  <p class="hint">只记录所选对话。已有对话在下一轮自动接入，当前请求不被中断。停止或关闭抓包插件后，已有 Agent 连接继续转发。</p>
  <div id="directory"></div><div id="error" role="alert"></div>
  <main><aside><div id="count"></div><div id="records"></div><p id="empty">暂无记录。选择窗口和对话，开始记录后向该对话发送消息。</p></aside>
  <section class="detail" aria-label="请求和响应内容"><div id="selection">选择一条请求查看上下文</div><div class="detailbar"><label>显示 <select id="direction"><option value="both">Req / Resp</option><option value="request">仅 Req</option><option value="response">仅 Resp</option></select></label><label><input type="checkbox" id="raw">原始 JSONL</label><button id="more" disabled title="读取更多" aria-label="读取更多" class="icon-button"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 10 7 7 7-7 M12 3v14"/></svg></button><span id="position"></span></div><div id="output" data-direction="both">
    <section class="log-pane" id="request-pane" aria-label="请求"><h2>Req · 请求</h2><pre id="request-output" tabindex="0" aria-label="请求日志"></pre></section>
    <section class="log-pane" id="response-pane" aria-label="响应"><h2>Resp · 响应</h2><pre id="response-output" tabindex="0" aria-label="响应日志"></pre></section>
  </div></section></main>
  <script type="module" src="./app.js"></script>
</body></html>
