<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AI 对话</title><link rel="stylesheet" href="conversation.css"></head>
<body><main><header><select id="window-group" aria-label="当前窗口会话分组" title="可重新打开历史窗口的对话分组"></select><span id="runtime-label">正在连接</span><button id="settings-toggle" aria-expanded="false" title="引擎与账户" aria-label="引擎与账户" class="icon-button"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16 M4 17h16 M8 4v6 M16 14v6"/></svg></button></header>
<div id="conversation-notice" role="status"></div><nav><select id="conversation-engine" aria-label="新对话引擎"><option value="codex">Codex</option><option value="claude">Claude Code</option></select><select id="history" aria-label="历史对话"><option value="">选择对话</option></select><button id="new" title="新对话" aria-label="新对话" class="icon-button"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14 M5 12h14"/></svg></button><button id="directory" title="选择工作目录" aria-label="选择工作目录" class="icon-button"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V4h7l2 3h9v13H3z"/></svg></button><span id="cwd">独立空间</span></nav>
<section id="transcript" aria-label="对话内容" aria-live="polite"><p class="empty">从这里开始，AI 可以发现并调用工作台插件提供的能力。</p></section>
<form id="composer"><textarea id="prompt" placeholder="输入问题或任务…" aria-label="消息" rows="3"></textarea><div class="actions"><span id="state">就绪</span><button type="button" id="reconnect-tools" title="重新连接工具" aria-label="重新连接工具" class="icon-button"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 7M4 4v6h6"/></svg></button><button type="button" id="stop" title="停止" aria-label="停止" class="icon-button"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h14v14H5z"/></svg></button><button type="submit" id="send" title="发送" aria-label="发送" class="icon-button"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 3 18 9-18 9 4-9z M7 12h14"/></svg></button></div></form></main><script type="module" src="conversation.js"></script></body></html>
