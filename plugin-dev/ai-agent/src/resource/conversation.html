<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AI 对话</title><link rel="stylesheet" href="conversation.css"></head>
<body><main><header><select id="window-group" aria-label="当前窗口会话分组" title="可重新打开历史窗口的对话分组"></select><span id="runtime-label">正在连接</span><button id="settings-toggle" aria-expanded="false">引擎与账户</button></header>
<section id="settings" hidden><h2>引擎管理</h2>
<div class="actions"><select id="config-engine" aria-label="配置引擎"><option value="codex">Codex</option><option value="claude">Claude Code</option></select><label><input type="checkbox" id="default-engine">设为默认引擎</label></div>
<p id="engine-info"></p><div class="actions"><button id="install">在线安装</button><button id="choose-archive">选择离线包</button><input id="archive-path" placeholder="离线 tar.gz 引擎包的绝对路径" aria-label="离线引擎包路径"><button id="import">导入离线包</button><button id="remove-engine">移除引擎</button></div><p id="installation" role="status"></p>
<p>引擎与登录分别保存在插件独立空间。移除引擎保留配置、授权和历史。</p><div class="actions"><button id="login">独立登录</button><button id="device-login">设备码登录</button><button id="cancel-login">取消登录</button><button id="logout">退出登录</button><button id="reuse-auth">复制本机授权</button></div><p id="account" role="status">尚未读取账户</p><p id="login-status" role="status"></p><div id="login-link"></div>
<div class="actions"><label><input type="checkbox" id="reuse-skills">复用本机 skills</label><label><input type="checkbox" id="reuse-rules">复用本机全局规范</label></div><p id="source-info"></p><p id="source-status" role="status"></p></section>
<div id="notice" role="status"></div><nav><select id="conversation-engine" aria-label="新对话引擎"><option value="codex">Codex</option><option value="claude">Claude Code</option></select><select id="history" aria-label="历史对话"><option value="">选择对话</option></select><button id="new">新对话</button><button id="directory">选择工作目录</button><span id="cwd">独立空间</span></nav>
<section id="transcript" aria-label="对话内容" aria-live="polite"><p class="empty">从这里开始，AI 可以发现并调用工作台插件提供的能力。</p></section>
<form id="composer"><textarea id="prompt" placeholder="输入问题或任务…" aria-label="消息" rows="3"></textarea><div class="actions"><span id="state">就绪</span><button type="button" id="stop">停止</button><button type="submit" id="send">发送</button></div></form></main><script type="module" src="conversation.js"></script></body></html>
