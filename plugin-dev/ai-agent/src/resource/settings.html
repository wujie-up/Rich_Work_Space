<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AI 引擎配置</title><link rel="stylesheet" href="settings.css"></head>
<body class="engine-page"><main><div id="notice" role="status"></div><nav class="settings-tabs" aria-label="配置分类"><button data-tab="engine" aria-selected="true">配置向导</button><button data-tab="mcp" aria-selected="false">MCP 服务</button><button data-tab="cli" aria-selected="false">高级设置</button><button data-tab="appearance" aria-selected="false">显示</button></nav>
<section id="settings"><div class="engine-selector"><label class="stacked">当前配置引擎<select id="config-engine" aria-label="当前配置引擎"><option value="codex">Codex</option><option value="claude">Claude Code</option></select></label><label><input role="switch" type="checkbox" id="default-engine">设为默认引擎</label></div>
<section data-panel="engine"><nav class="setup-steps" aria-label="配置步骤"><button data-step="install" aria-current="step"><span class="step-number">1</span><span>安装引擎</span></button><button data-step="connect"><span class="step-number">2</span><span>连接</span></button><button data-step="model"><span class="step-number">3</span><span>模型</span></button></nav><section data-step-panel="install"><div class="section-heading"><h3>安装引擎</h3><button class="help" aria-label="引擎隔离说明" title="引擎与登录分别保存在插件独立空间。移除引擎保留配置、授权和历史。"></button></div>
<div class="runtime-summary"><p id="engine-info"></p><button id="runtime-details" class="help" aria-label="引擎来源与校验信息" title="引擎来源与校验信息"></button></div><p id="installation" role="status"></p>
<div class="setting-block"><label class="stacked">目标版本<select id="target-version" aria-label="目标版本"><option value="">内置校验版本</option></select></label><div class="actions"><button id="load-versions" title="检查在线版本" aria-label="检查在线版本" class="icon-button"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10a8 8 0 1 0-1 7 M20 4v6h-6"/></svg></button><button id="install" title="在线安装" aria-label="在线安装" class="icon-button"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14v7h16v-7 M12 3v12 M7 10l5 5 5-5"/></svg></button></div><p id="versions-status" role="status"></p></div>
<details class="setting-block"><summary>从离线包安装</summary><div class="actions"><input id="archive-path" placeholder="离线 tar.gz 引擎包的绝对路径" aria-label="离线引擎包路径"><button id="choose-archive" title="选择离线包" aria-label="选择离线包" class="icon-button"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V4h7l2 3h9v13H3z"/></svg></button><button id="import" title="导入离线包" aria-label="导入离线包" class="icon-button"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14v7h16v-7 M12 3v12 M7 10l5 5 5-5"/></svg></button></div></details></section><section data-step-panel="connect" hidden><div class="section-heading"><h3>已配置的账号与连接</h3><button class="help" aria-label="供应商协议说明" title="Codex 要求 Responses API；Claude Code 要求 Anthropic Messages 兼容接口。品牌名称不代表协议兼容，Chat Completions 接口不能直接供 Codex 使用。连接测试会产生一次小请求；保存不代表引擎验证通过。"></button></div>
<div id="configured-connections"><label class="stacked">当前供应商<select id="active-provider" aria-label="当前供应商"></select></label><div id="provider-list"></div><div id="account-card" class="connection-card"><div class="connection-heading"><strong>引擎账号</strong><span id="account-selected" class="connection-badge">当前选择</span></div><p id="account" role="status">尚未读取账户</p></div></div>
<section id="new-connection"><div class="section-heading"><h3>新增账号或连接</h3><button type="button" id="provider-add" title="新增连接" aria-label="新增连接" class="icon-button"></button></div><details id="account-connection" class="setting-block"><summary>登录引擎账号</summary><div class="actions"><button id="login" title="独立登录" aria-label="独立登录" class="icon-button"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3h6v18h-6 M3 12h13 M11 7l5 5-5 5"/></svg></button><button id="device-login" title="设备码登录" aria-label="设备码登录" class="icon-button"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3h16v13H4z M8 21h8 M12 16v5 M8 8l-2 2 2 2 M16 8l2 2-2 2"/></svg></button><button id="cancel-login" title="取消登录" aria-label="取消登录" class="icon-button"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12 M6 18L18 6"/></svg></button><button id="logout" title="退出登录" aria-label="退出登录" class="icon-button"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3H3v18h6 M8 12h13 M16 7l5 5-5 5"/></svg></button><button id="reuse-auth" title="复制本机授权" aria-label="复制本机授权" class="icon-button"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 9h12v12H9z M15 9V3H3v12h6"/></svg></button></div><p id="login-status" role="status"></p><div id="login-link"></div></details>
<form id="provider-form" hidden><h3 id="provider-heading">添加供应商</h3><label>模板<select id="provider-template"><option value="custom">自定义兼容接口</option><option value="openai">OpenAI</option><option value="anthropic">Anthropic</option><option value="deepseek">DeepSeek</option><option value="qwen">千问</option><option value="kimi">Kimi</option></select></label><label>名称<input id="provider-name" required maxlength="100"></label><label>协议<input id="provider-protocol" readonly></label><label>接口地址<input id="provider-url" type="url" required placeholder="https://api.example.com/v1"></label><label>API Key<input id="provider-secret" type="password" autocomplete="new-password" placeholder="留空保留原密钥"></label><label class="inline"><input id="clear-secret" type="checkbox">清除已保存密钥</label><div class="actions"><button type="button" id="provider-reset" title="取消编辑" aria-label="取消编辑" class="icon-button"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12 M6 18L18 6"/></svg></button></div></form>
</section><p id="provider-status" role="status"></p></section><section data-step-panel="model" hidden><h3>确认模型</h3><dl class="model-summary"><div><dt>引擎</dt><dd id="summary-engine"></dd></div><div><dt>连接</dt><dd id="summary-provider"></dd></div><div><dt>模型</dt><dd id="summary-model"></dd></div></dl>
<div id="model-editor" hidden><label>模型<input id="provider-model" form="provider-form" required></label><div class="actions"><button id="provider-save" type="button" title="保存" aria-label="保存" class="icon-button"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3h14l3 3v15H3V3z M7 3v6h10V3 M7 21v-8h10v8"/></svg></button></div></div><p id="setup-status" role="status"></p></section></section><section data-panel="mcp" hidden><div class="actions"><h2>MCP 服务</h2><button id="refresh-services" title="刷新服务" aria-label="刷新服务" class="icon-button"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10a8 8 0 1 0-1 7 M20 4v6h-6"/></svg></button></div><label><input role="switch" id="mcp-all" type="checkbox">自动使用全部已启动服务</label><div id="service-list"></div><button id="save-services" title="保存服务选择" aria-label="保存服务选择" class="icon-button"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3h14l3 3v15H3V3z M7 3v6h10V3 M7 21v-8h10v8"/></svg></button><p id="mcp-status" role="status"></p></section><section data-panel="cli" hidden><h3>本机配置复用</h3><div class="actions"><label><input role="switch" type="checkbox" id="reuse-skills">复用本机 skills</label><label><input role="switch" type="checkbox" id="reuse-rules">复用本机全局规范</label><button id="source-info" class="help" aria-label="本机授权、技能与规范来源" title="本机授权、技能与规范来源"></button></div><p id="source-status" role="status"></p><details class="setting-block" id="external-cli"><summary>外部 CLI 参数</summary><div id="cli-fields"></div><button class="help" aria-label="CLI 参数说明" title="Codex、Claude Code 分别安装、登录，Claude Code 始终使用独立引擎。外部命令仅用于 Codex Legacy 模式和自定义 CLI。参数直接传给进程，不经过 shell。修改仅影响之后新建的会话。"></button><button id="save-cli" title="保存配置" aria-label="保存配置" class="icon-button"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3h14l3 3v15H3V3z M7 3v6h10V3 M7 21v-8h10v8"/></svg></button><p id="cli-status" role="status"></p></details><details class="setting-block"><summary>移除引擎</summary><div class="actions"><button id="remove-engine" title="移除引擎" aria-label="移除引擎" class="icon-button"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18 M9 6V3h6v3 M5 6l1 15h12l1-15 M10 10v7 M14 10v7"/></svg></button></div></details></section></section>
<section data-panel="appearance" hidden><div class="appearance-row"><label for="conversation-font-size">会话字号</label><button class="help" aria-label="字号适用范围" title="应用于所有会话组、会话内容和输入区，立即生效并自动保存。"></button><select id="conversation-font-size" aria-label="会话字号"></select></div></section>
</main><script type="module" src="settings.js"></script></body></html>
