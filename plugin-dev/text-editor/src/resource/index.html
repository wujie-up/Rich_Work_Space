<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'none'; img-src 'self' data:; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>文本编辑器</title><link rel="stylesheet" href="app.css"></head>
<body><main>
<header>
<div class="actions">
  <button id="history-toggle" class="icon-button" aria-label="历史文件" title="历史文件" aria-expanded="false" aria-controls="history-panel">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2 7M3 4v7h7M12 7v6l4 2"/></svg>
  </button>
  <button id="open" class="icon-button" aria-label="打开文件" title="打开文件 (⌘O / Ctrl+O)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H5v20h14V7zM14 2v6h5M8 14h8m-3-3 3 3-3 3"/></svg>
  </button>
  <button id="new" class="icon-button" aria-label="新建文件" title="新建文件">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3H3v18h11M12 3v6h6L12 3M7 13h4M7 17h4M18 13v8M14 17h8"/></svg>
  </button>
  <button id="save" class="icon-button" disabled aria-label="保存" title="保存 (⌘S / Ctrl+S)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h14l3 3v15H3V3zM7 3v6h10V3M7 21v-8h10v8"/></svg>
  </button>
  <button id="save-as" class="icon-button" disabled aria-label="另存为" title="另存为">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H3v18h18V10M7 3v6h5M7 21v-8h7M16 3h5v5M21 3l-7 7"/></svg>
  </button>
</div><span id="document-name"></span><span id="dirty"></span>
<div id="configuration">
<div id="editor-tools" role="group" aria-label="编辑器工具">
<button id="search" class="icon-button" disabled aria-label="搜索" title="搜索 (⌘F / Ctrl+F)"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></svg></button>
<button id="format" title="格式化" aria-label="格式化" class="icon-button"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16 M4 10h10 M4 15h16 M4 20h10"/></svg></button><div class="modes" role="group" aria-label="显示模式">
  <button data-mode="edit" class="icon-button" aria-label="编辑" title="编辑">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 16-1 5 5-1L21 7l-4-4zM14 6l4 4"/></svg>
  </button>
  <button data-mode="read" class="icon-button" aria-label="阅读" title="阅读">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
  </button>
  <button data-mode="split" class="icon-button selected" aria-label="分栏" title="分栏">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M12 4v16M6 8h3M6 12h3M15 8h3M15 12h3"/></svg>
  </button>
</div>
<button id="present" class="icon-button" disabled aria-label="演示" title="演示（全屏展示全文）">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
</button>
<label class="zoom">字号 <input id="font-size" type="number" min="10" max="28" value="14" aria-label="字号"></label></div></div></header>
<section id="search-bar" role="search" aria-label="文内搜索" hidden>
  <input type="search" aria-label="搜索当前文档" placeholder="搜索当前文档" spellcheck="false" aria-controls="editor preview" autocomplete="off">
  <output id="search-count" aria-live="polite">0 / 0</output>
  <button id="search-previous" class="icon-button" disabled aria-label="上一个结果" title="上一个结果 (Shift+Enter)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg></button>
  <button id="search-next" class="icon-button" disabled aria-label="下一个结果" title="下一个结果 (Enter)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
  <button id="search-close" class="icon-button" aria-label="关闭搜索" title="关闭搜索 (Esc)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
</section>
<div class="body"><aside id="files" tabindex="0" aria-label="文件列表">
<div class="group-toolbar">
  <button id="group-settings" class="icon-button" disabled aria-label="分组操作" title="分组操作"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
</div>
<details id="draft-group" class="file-group" data-group="drafts" open>
  <summary title="草稿 · 固定分组"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg><span>草稿</span></summary>
  <nav id="draft-list" class="group-contents" aria-label="恢复草稿"></nav>
</details>
<nav id="group-files" aria-label="文件分组"></nav><p id="group-empty" hidden></p></aside>
<button id="toggle-files" aria-label="收起文件列表" title="收起文件列表（拖动调整宽度）" aria-expanded="true" aria-controls="files"></button>
<div id="panes" data-mode="split" hidden><div id="source-pane"><pre id="source-highlight" aria-hidden="true" hidden></pre><textarea id="editor" spellcheck="false" aria-label="文本内容" placeholder="开始编写，或打开本地文件…"></textarea><div id="line-numbers" aria-hidden="true"></div></div><article id="preview" aria-label="Markdown 预览"></article>
<div id="outline-zone" tabindex="0" role="group" aria-label="显示文档大纲" title="文档大纲" hidden><nav id="outline" class="context-menu" aria-label="文档大纲"></nav></div>
</div></div>
<footer><span id="status" role="status">就绪 · 支持 UTF-8 文本，最大 16 MiB</span><span id="position"></span></footer>
</main>
<section id="history-panel" class="context-menu" popover="manual" aria-label="历史文件列表">
  <div class="history-heading"><span>历史文件</span><button id="history-close" class="icon-button" aria-label="关闭历史文件" title="关闭历史文件"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div>
  <nav id="history" aria-label="历史文件"></nav><p id="history-empty">暂无历史文件</p>
</section>
<div id="group-create-menu" class="context-menu" role="menu" popover="manual" aria-label="分组操作">
  <button id="add-group" data-action="create" class="icon-button" role="menuitem" aria-label="新建分组" title="新建分组"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg></button>
</div>
<div id="group-menu" class="context-menu" role="menu" popover="manual" aria-label="分组操作">
  <button data-action="rename" class="icon-button" role="menuitem" aria-label="重命名分组" title="重命名分组"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 16-1 5 5-1L21 7l-4-4zM14 6l4 4"/></svg></button>
  <button data-action="delete" class="icon-button" role="menuitem" aria-label="删除分组" title="删除分组（文件移回未分组）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></svg></button>
</div>
<dialog id="group-dialog" aria-labelledby="group-dialog-title">
  <div class="dialog-heading" id="group-dialog-title"></div>
  <div class="dialog-body"><label>名称<input aria-label="分组名称" maxlength="60" required spellcheck="false" autofocus></label><p></p></div>
  <div class="dialog-actions">
    <button data-cancel class="icon-button" aria-label="取消" title="取消"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
    <button data-confirm class="icon-button" aria-label="确认" title="确认"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></button>
  </div>
</dialog>
<div id="file-menu" class="context-menu" role="menu" aria-label="文件操作" hidden>
  <button data-action="renameFile" role="menuitem" class="icon-button" aria-label="重命名" title="重命名"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 16-1 5 5-1L21 7l-4-4zM14 6l4 4"/></svg></button>
  <button data-action="removeHistory" role="menuitem" class="icon-button" aria-label="移除记录" title="从历史记录移除并关闭对应正文，未保存内容留为草稿，保留磁盘文件"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
  <button data-action="deleteFile" role="menuitem" class="icon-button" aria-label="删除文件" title="删除文件"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></svg></button>
  <button data-action="copyFile" role="menuitem" class="icon-button" aria-label="复制文件" title="复制文件（Ctrl/Cmd+C），可粘贴到 Agent 会话"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8h12v13H8zM16 8V3H3v13h5"/></svg></button>
</div>
<dialog id="file-action-dialog" aria-labelledby="file-action-title">
  <div class="dialog-heading" id="file-action-title"></div>
  <div class="dialog-body"><label>名称<input aria-label="新的文件名称" required spellcheck="false" autofocus></label><p></p></div>
  <div class="dialog-actions">
    <button data-cancel class="icon-button" aria-label="取消" title="取消"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
    <button data-confirm class="icon-button" aria-label="确认" title="确认"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></button>
  </div>
</dialog>
<button id="exit-presentation" class="icon-button" aria-label="退出演示" title="退出演示（Esc）" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>
</button>
<dialog id="document-dialog" aria-labelledby="document-dialog-title">
<form id="document-form">
  <div class="dialog-heading" id="document-dialog-title">新建文件</div>
  <div class="dialog-body">
    <label>名称<input id="filename" aria-label="文件名称" value="未命名.md" spellcheck="false" required autofocus></label>
    <label>文件格式<select id="type" aria-label="文件格式"><option value="md">Markdown</option><option value="txt">TXT</option><option value="json">JSON</option><option value="xml">XML</option><option value="yaml">YAML</option><option value="sql">SQL</option></select></label>
  </div>
  <div class="dialog-actions">
    <button id="cancel-document" type="button" class="icon-button" aria-label="取消" title="取消"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
    <button id="confirm-document" type="button" class="icon-button" aria-label="确认" title="确认"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></button>
  </div>
</form>
</dialog>
<dialog id="diagram-viewer" aria-label="绘图查看器">
  <div class="diagram-tools-zone" tabindex="0" role="group" aria-label="绘图缩放控制">
  <div class="diagram-tools context-menu" hidden>
    <button data-zoom="out" title="缩小" aria-label="缩小" class="icon-button"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16"/></svg></button>
    <output aria-label="绘图缩放比例" aria-live="polite">100%</output>
    <button data-zoom="in" title="放大" aria-label="放大" class="icon-button"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16 M12 4v16"/></svg></button>
    <button data-zoom="reset" title="重置" aria-label="重置" class="icon-button"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10a8 8 0 1 0-1 7 M20 4v6h-6"/></svg></button>
  </div></div>
  <button data-zoom="close" autofocus title="关闭" aria-label="关闭" class="icon-button"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12 M6 18L18 6"/></svg></button>
  <div class="diagram-viewport"><div class="diagram-canvas"></div></div>
</dialog>
<script type="module" src="app.js"></script></body></html>
